    <title>PixelCraft Pro - Advanced AI Photo Editor</title>

    <!-- Schema.org Markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "applicationCategory": "MultimediaApplication",

      "offers": {

    <link rel="icon" type="image/png" href="icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://uicdn.toast.com/tui-image-editor/latest/tui-image-editor.css">

    <link rel="stylesheet" href="style.css">

<body>

    <!-- Header -->
    <header class="app-header">
        <div class="logo-area">
            <img src="logo.png" alt="Logo">
            <span>PixelCraft Pro</span>
            <a href="https://www.imagecompress.in/" class="home-link">Home</a>
        </div>

        <div class="header-actions">
            <!-- Custom Top Actions -->
            <input type="file" id="upload-file" accept="image/*" hidden>
            <button class="btn btn-primary" onclick="document.getElementById('upload-file').click()"
                title="Open New Image">📂 Open</button>
            <button class="btn" id="btn-zoom-in" title="Zoom In">➕</button>
            <button class="btn" id="btn-zoom-out" title="Zoom Out">➖</button>
            <button class="btn" id="btn-reset" title="Reset All">🔄 Reset</button>

            <button class="btn" id="btn-undo">↩ Undo</button>
            <button class="btn" id="btn-redo">↪ Redo</button>
            <button class="btn btn-primary" id="btn-save">✨ Export HD</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-workspace">
        <!-- The Editor Canvas -->
        <div id="tui-image-editor-container"></div>
    </main>

    <!-- AdSense Banner -->
    <div class="ad-container">
        <script async
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8732458645979427"

        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8732458645979427"

        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>

    <!-- App Footer -->

            <a href="https://www.imagecompress.in/contact-us/">Contact Us</a> |

            <a href="https://www.imagecompress.in/terms-and-conditions/">Terms & Conditions</a> |
            <a href="https://www.imagecompress.in/dmca-policy/">DMCA</a>
        </div>
        <div class="footer-copyright">
            Copyright &copy; 2026 | Powered by <a href="https://www.imagecompress.in/"
                class="text-white">imagecompress.in</a>
        </div>
    </footer>

    <!-- Dependencies -->

    <script src="https://uicdn.toast.com/tui-color-picker/v2.2.6/tui-color-picker.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.8/FileSaver.min.js"></script>
    <script src="https://uicdn.toast.com/tui-image-editor/latest/tui-image-editor.js"></script>
    <script src="script.js"></script>
